builds:
  include:
    - "checks.x86_64-linux.*"
    - "checks.aarch64-linux.*"
    - "checks.x86_64-darwin.*"
    - "checks.aarch64-darwin.*"
    - "devShells.x86_64-linux.default"
    - "devShells.aarch64-linux.default"
    - "devShells.x86_64-darwin.default"
    - "devShells.aarch64-darwin.default"
    # cargoArtifacts (cached cargo deps incl. libduckdb-sys) + webDist (pre-built
    # React viewer). Listing them here ensures Garnix populates cache.garnix.io
    # for both, so the cargo-test sandbox check below is a cache hit on
    # subsequent pushes that haven't touched Cargo.lock or web/.
    - "packages.x86_64-linux.cargoArtifacts"
    - "packages.aarch64-linux.cargoArtifacts"
    - "packages.x86_64-linux.webDist"
    - "packages.aarch64-linux.webDist"
  exclude: []
